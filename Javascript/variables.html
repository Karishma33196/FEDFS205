<html lang="en">
<head>

</head>
<body>
   <script>
      document.write(m,"<br>");//printed before declaration-undefined
      var m=50;
      document.write(m,"<br>");
      m+=10;
      document.write(m,"<br>");
      n = 5;
      n++;
      document.write(n,"<br>");
function kl_fun(){
   return "this is a simple return from the function";
document.writeln("this is from kl fun()","<br>");
}kl_fun();
function kl_fun2(){
   return "this is a simple return from the function";
}
document.writeln(kl_fun2());
 var x =100;
    document.write(x,"<br>");
    var x=200;
     document.write(x+x,"<br>");
     let y=300;
     document.write(y,"<br>");

     let z=30;//global declaration
     document.write(z,"<br>");
     {
        let z=40;//local declaration
        document.write(z,"<br>");//scope concept
     }
     document.write(z,"<br>");
     const i =25;
     document.write(i,"<br>");
   
     {
        const i =45;
        document.write(i,"<br>");
     }
     document.write(i,"<br>");
     let a=10;
     let b=0.2;
     let c=true;
     d = "sridevi";
     e=null;
     document.write(typeof(a),"<br>");
     document.write(typeof(b),"<br>");
     document.write(typeof(c),"<br>");
     document.write(typeof(d),"<br>");
     document.write(typeof(e),"<br>");
     
   document.write(typeof 100,"<br>");
   document.write(typeof 12.567,"<br>");
   document.write(typeof "sridevi","<br>");
   document.write(typeof [],"<br>");
   document.write(typeof {},"<br>");
   document.write(typeof kl_fun(),"<br>");
   document.write(typeof false,"<br>");
   document.write(typeof 100n,"<br>");
   </script> 
</body>
