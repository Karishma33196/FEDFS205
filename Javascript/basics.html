<body>
   <script>
    document.write("Welcome to JavaScript....!","<br>");
     document.write("Welcome to S205....!","<br>");// use " " for strings
      document.write(10,"<br>");// no need " " for printing integers
      document.write(10+"10","<br>");//1010
      document.write(10+ +"10","<br>");// type cohersion-automatically converted to left datatype,here,we qre giving two +s with space because'+' gives first priority as a cancatenation operator
        document.write("1"+"2"+"10","<br>");
          document.write(10 - "10","<br>");
            document.write(10/"0","<br>");
            document.write(10 / "A","<br>");
            //assignment opeartors: =,==,===
            var x=100;
            document.write(10==10,"<br>");//boolean value with comparison
            document.write(10==5,"<br>");
        document.write(10=="10","<br>");
           document.write(10==="10","<br>");//strict comparison(not with value but with data type as well)
           document.write(0.5+0.4,"<br>");
           document.write(true+1,"<br>");//true=1,true+1=2
           document.write(3>2>1,"<br>");//3>2:true=1>1
           document.write(10/5*2,"<br>");//Bodmas rule
           document.write((9>12>2)?("FEDF"):("s-205"));
           9>12>2?document.write("fedf"):document.write("s-205");
           </script>
