<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Demo</title>
</head>
<body>
<form action="success.html">
  <caption><b>Student Registration System</b></caption><br><br>
  <label for="fn">First Name:</label> 
  <input type="text" id="fn" name="firstname" required><br><br>
  <label for="ln">Last Name:</label> 
  <input type="text" id="ln" name="lastname" required><br>
  <label>Gender:</label>
    <input type="radio" id="gn" name="gender" value="Male" required>Male
    <input type="radio" id="gn" name="gender" value="Female" required>Female<br>
  <label>Email:</label>
  <input type="email" required ><br><br>
  <label>Contact:</label>
  <input type="tel" pattern="[0-9]{10}"><br><br>
  <label>Date of birth</label>
  <input type="date" required><br><br>
  <label>Address:</label>
  <textarea rows="10"></textarea><br><br>
  <label>Langs known</label>
    <input type="checkbox" value="telugu" >Telugu
    <input type="checkbox" value="hindi" >Hindi
    <input type="checkbox" value="english" >English<br>
  <label>Select Branch:</label>
  <select>
    <option value="" >--select--</option>
    <option value="CSE" >CSE</option>
    <option value="ECE" >ECE</option>
    <option value="EEE" >EEE</option>
    <option value="MEC" >MEC</option>
  </select><br><br>
  <label>Upload Resume:</label>
    <input type="file"><br><br>
  <button>Submit</button>
</form>  
</body>
</html>
