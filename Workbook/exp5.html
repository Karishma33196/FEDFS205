<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form Validation</title>
<style>
  input { margin: 8px 0; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  .error { border-color: red; }
  .success { border-color: green; }
  #msg { font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<form id="regForm">
  <input type="text" id="name" placeholder="Full Name" required><br>
  <input type="email" id="email" placeholder="Email" required><br>
  <input type="password" id="password" placeholder="Password" required><br>
  <input type="text" id="phone" placeholder="Phone" pattern="[0-9]{10}" required><br>
  <button type="submit">Register</button>
</form>

<p id="msg"></p>

<script>
document.getElementById("regForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let email = document.getElementById("email").value.trim();
  let pass = document.getElementById("password").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let msg = document.getElementById("msg");

  // Reset previous styles
  document.getElementById("email").classList.remove("error", "success");
  document.getElementById("password").classList.remove("error", "success");
  document.getElementById("phone").classList.remove("error", "success");
  msg.innerText = "";

  let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Validate email
  if (!emailRegex.test(email)) {
    msg.innerText = "Invalid Email";
    document.getElementById("email").classList.add("error");
    return;
  } else {
    document.getElementById("email").classList.add("success");
  }

  // Validate password
  if (pass.length < 6) {
    msg.innerText = "Weak Password (minimum 6 characters)";
    document.getElementById("password").classList.add("error");
    return;
  } else {
    document.getElementById("password").classList.add("success");
  }

  // Validate phone
  if (!/^[0-9]{10}$/.test(phone)) {
    msg.innerText = "Invalid Phone Number";
    document.getElementById("phone").classList.add("error");
    return;
  } else {
    document.getElementById("phone").classList.add("success");
  }

  // If all valid
  msg.innerText = "Registration Successful!";
  msg.style.color = "green";
});
</script>

</body>
</html>
